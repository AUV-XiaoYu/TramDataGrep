{% extends "base.html" %}
{% block title %}修改密码 - 电车票务数据平台{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-key"></i> 修改密码
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('change_password_route') }}">
                    <div class="mb-3">
                        <label for="old_password" class="form-label">原密码</label>
                        <input type="password" class="form-control" id="old_password"
                               name="old_password" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">新密码</label>
                        <input type="password" class="form-control" id="new_password"
                               name="new_password" required minlength="6"
                               placeholder="至少6位">
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">确认新密码</label>
                        <input type="password" class="form-control" id="confirm_password"
                               name="confirm_password" required minlength="6">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> 确认修改
                        </button>
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
